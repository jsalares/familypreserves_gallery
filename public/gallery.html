<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your photos · Family Preserves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/assets/jar.png" alt="">
    <div><span class="brand-name serif">Family Preserves</span><span class="brand-tag">Preserve · Enhance · Relive</span></div>
  </div>
  <div class="topbar-right">
    <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
    <button class="btn btn-ghost" id="undo" type="button" hidden>Undo</button>
    <button class="btn btn-ghost" id="signout" type="button">Sign out</button>
  </div>
</header>

<section class="intro wrap-wide">
  <div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="title serif" id="title">Your photos</h1>
  </div>
  <div class="help">
    <button class="help-btn serif" id="help-btn" type="button" aria-expanded="false" aria-controls="help-pop" aria-label="How this works">?</button>
    <div class="help-pop" id="help-pop" role="dialog" aria-label="How this works" hidden>
      <div class="help-head">
        <strong class="serif">How this works</strong>
        <button type="button" class="icon-btn" id="help-close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p>Categorize your pictures by creating custom folders and assigning photos to those folders. You can also add other details like year, event and people, so your photos are easy to search.</p>
    </div>
  </div>
</section>

<div class="shelves" id="shelves"></div>
<p class="notice" id="notice" role="alert" hidden></p>
<main class="wrap-wide main" id="main"><p class="status">Loading your photos…</p></main>

<script src="/assets/gallery.js"></script>
</body>
</html>
